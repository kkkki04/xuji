name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    defaults:
      run:
        working-directory: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run dist:mac

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xuji-mac-arm64
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
            macos/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
