name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 序集.exe
        run: powershell -ExecutionPolicy Bypass -File windows/src/build.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: xuji-windows-x64
          path: 序集.exe
          if-no-files-found: error
          retention-days: 14
